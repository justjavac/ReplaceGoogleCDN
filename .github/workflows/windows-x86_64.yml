name: windows-x86_64

on: [push, pull_request]

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  windows:
    if: 1
    runs-on: windows-latest
    steps:
      - name: Prepare git
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          Get-ChildItem Env:
          ipconfig
          $PSVersionTable
          [System.Environment]::OSVersion.VersionString
          Get-Location
          ipconfig /all

      - uses: actions/checkout@v4
      - name: Prepare Chromium Run Environment
        run: |
          ipconfig /all

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\var\chrome-win.zip
            ${{ github.workspace }}\var\chrome-win
          key: ${{ runner.os }}-x86_64-chromium

      - name: Download Chromium
        shell: bash
        run: |
          set -x
          if [ ! -f var/chrome-win.zip ] ; then
            bash tools/download-chromium.sh
          fi

      - name: Cache Firefox
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\var\firefox.exe
          key: ${{ runner.os }}-x86_64-firefox

      - name: Download Firefox
        shell: bash
        run: |
          set -x
          if [ ! -f var/firefox.exe ] ; then
            bash tools/download-firefox.sh
          fi

      - name: install firefox
        shell: powershell
        run: |
          Get-ChildItem
          Get-Location

          $installer = Join-Path (Get-Location) "var\firefox.exe"
          $firefox = "C:\Program Files\Mozilla Firefox\firefox.exe"
          Start-Process -FilePath $installer -ArgumentList "/A /S"

          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 5
            $firefoxReady = Test-Path $firefox
            if ($firefoxReady) {
              break
            }
          } while ((Get-Date) -lt $deadline)

          if (-not $firefoxReady) {
            throw "Firefox was not installed before timeout"
          }

          Get-ChildItem "C:\Program Files\Mozilla Firefox"

      - name: show browser version
        shell: cmd
        run: |
          DIR var
          :: var\chrome-win\chrome.exe --version
          "C:\Program Files\Mozilla Firefox\firefox.exe" --version

        # https://www.msys2.org/docs/ci/
